name: Data Lakehouse ETL Pipeline

on:
  schedule:
    # Corre todos os dias à meia-noite (UTC)
    - cron: "0 0 * * *"
  workflow_dispatch:
    # Este trigger cria um botão no GitHub para poderes correr o script manualmente sempre que quiseres!

jobs:
  run-etl:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar o Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar o pipeline (Seeder + Silver + Gold)
        env:
          NEON_DB_URL: ${{ secrets.NEON_DB_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_BUCKET: ${{ secrets.SUPABASE_BUCKET }}
          AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
        run: |
          python seeder_cloud.py
